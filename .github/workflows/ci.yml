name: firmware-ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run build-script tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify Waveshare target is discoverable
        run: |
          python scripts/build.py --list-boards > boards.txt
          grep -F "waveshare/esp32-s3-touch-lcd-1.85b" boards.txt

  face-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop simulator dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build xvfb
      - name: Configure
        run: cmake -S tools/face-simulator -B build/face-simulator -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/face-simulator --parallel 2
      - name: Test controller
        run: ctest --test-dir build/face-simulator --output-on-failure
      - name: Smoke-test LVGL SDL simulator
        run: |
          set +e
          timeout 3s xvfb-run -a build/face-simulator/nara-face-simulator
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "Simulator stayed alive for the smoke-test window."
            exit 0
          fi

          echo "Simulator exited unexpectedly with status $status" >&2
          exit 1

  waveshare-1-85b-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compile Waveshare ESP32-S3-Touch-LCD-1.85B
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          command: >-
            python scripts/build.py
            waveshare/esp32-s3-touch-lcd-1.85b
            --name esp32-s3-touch-lcd-1.85b

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nara-waveshare-1.85b-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/merged-binary.bin
            build/**/*.bin
            build/flasher_args.json
            sdkconfig
            dependencies.lock
