name: firmware-ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run build-script tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify Waveshare target is discoverable
        run: |
          python scripts/build.py --list-boards > boards.txt
          grep -F "waveshare/esp32-s3-touch-lcd-1.85b" boards.txt
      - name: Verify production dependency lock
        run: |
          test -f dependencies.lock.esp32s3
          grep -F "target: esp32s3" dependencies.lock.esp32s3

  face-simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install desktop simulator dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build xvfb
      - name: Configure
        run: cmake -S tools/face-simulator -B build/face-simulator -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/face-simulator --parallel 2
      - name: Test controller
        run: ctest --test-dir build/face-simulator --output-on-failure
      - name: Smoke-test LVGL SDL simulator
        run: |
          set +e
          timeout 3s xvfb-run -a build/face-simulator/nara-face-simulator
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "Simulator stayed alive for the smoke-test window."
            exit 0
          fi

          echo "Simulator exited unexpectedly with status $status" >&2
          exit 1

  waveshare-1-85b-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Compile Waveshare ESP32-S3-Touch-LCD-1.85B
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          command: >-
            python scripts/build.py
            waveshare/esp32-s3-touch-lcd-1.85b
            --name esp32-s3-touch-lcd-1.85b

      - name: Verify dependency lock did not drift
        run: git diff --exit-code -- dependencies.lock.esp32s3

      - name: Verify production boot safety flags
        shell: bash
        run: |
          if grep -q '^CONFIG_BOOTLOADER_SKIP_VALIDATE_ALWAYS=y$' sdkconfig; then
            echo "Unsafe bootloader skip-validation flag is enabled" >&2
            exit 1
          fi
          grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y$' sdkconfig

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nara-waveshare-1.85b-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/merged-binary.bin
            build/**/*.bin
            build/flasher_args.json
            sdkconfig
            dependencies.lock.esp32s3


  waveshare-production-security-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Compile signed production-security profile with ephemeral CI key
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          command: >-
            bash -lc '
            set -euo pipefail;
            openssl genpkey -algorithm RSA
            -pkeyopt rsa_keygen_bits:3072
            -out .ci-secure-boot-signing-key.pem >/dev/null 2>&1;
            export IDF_CI_BUILD=1;
            python scripts/build.py
            waveshare/esp32-s3-touch-lcd-1.85b
            --name esp32-s3-touch-lcd-1.85b
            --security-profile production
            --secure-boot-signing-key .ci-secure-boot-signing-key.pem;
            python scripts/verify_production_security_config.py sdkconfig;
            espsecure.py signature-info-v2 build/nara_firmware.bin;
            rm -f .ci-secure-boot-signing-key.pem
            '

      - name: Ensure CI signing key was not persisted
        run: test ! -e .ci-secure-boot-signing-key.pem
